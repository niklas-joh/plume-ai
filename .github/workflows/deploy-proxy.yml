# Deploys the Cloudflare Worker in plume-proxy/ on every push to main
# that touches Worker source. Uses cloudflare/wrangler-action@v3 with a
# CLOUDFLARE_API_TOKEN secret — no personal machine or Tailscale dependency.
#
# Manual dispatch (workflow_dispatch) is available to re-deploy the dev Worker
# without a commit, e.g. after rotating a Worker secret. Prod deploys happen
# in release.yml, not here.
name: Deploy proxy Worker

on:
  push:
    branches: [ main ]
    paths:
      - 'plume-proxy/src/**'
      - 'plume-proxy/wrangler.toml'
      - 'plume-proxy/package.json'
      - 'plume-proxy/package-lock.json'
      - '.github/workflows/deploy-proxy.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: wrangler deploy
    runs-on: ubuntu-latest
    if: github.actor == 'niklas-joh'
    concurrency:
      group: worker-deploy
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24' # >=22.12.0 satisfies @rolldown/binding-linux-x64-gnu engine constraint
          cache: npm
          cache-dependency-path: plume-proxy/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund
        working-directory: plume-proxy

      - name: Run tests
        run: npm test
        working-directory: plume-proxy

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          workingDirectory: plume-proxy
          command: deploy --env="dev" # targets plume-proxy-dev; prod deploy happens in release.yml
