name = "plume-proxy"
main = "src/index.ts"
compatibility_date = "2025-01-01"

[placement]
mode = "smart"

[observability]
enabled = true
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

[observability.traces]
enabled = true
persist = true
head_sampling_rate = 1

[[kv_namespaces]]
binding = "USAGE_KV"
id = "71612d363b07408bb70eec49d5739b1c"
preview_id = "38975852f1bc4c838da456ea9a21e789"

[[analytics_engine_datasets]]
binding = "PLUME_METRICS"
dataset = "plume_metrics"

# Opt-in plugin usage events (POST /v1/events). Linked to sites through the heartbeat
# site_key (blob19), which equals plume_metrics.index1 for the same site.
[[analytics_engine_datasets]]
binding = "PLUME_EVENTS"
dataset = "plume_events"

# Rate limits for /v1/events (in-memory at the edge, no KV writes). Namespace IDs
# must be unique per account. Sites send from an hourly cron (up to 8 batches per
# run), and many sites can share one IP on shared hosting, hence the generous limits.
[[ratelimits]]
name = "EVENTS_IP_LIMITER"
namespace_id = "1101"

  [ratelimits.simple]
  limit = 120
  period = 60

[[ratelimits]]
name = "EVENTS_INSTALL_LIMITER"
namespace_id = "1102"

  [ratelimits.simple]
  limit = 30
  period = 60

# Secrets (set via CLI — never commit values):
# wrangler secret put ANTHROPIC_API_KEY
# wrangler secret put OPENAI_API_KEY
# wrangler secret put GEMINI_API_KEY
# wrangler secret put LS_WEBHOOK_SECRET            ← must match LemonSqueezy webhook signing secret
# wrangler secret put LS_PRO_MONTHLY_VARIANT_ID    ← LemonSqueezy: Products → Plume Pro → Variants
# wrangler secret put LS_PRO_ANNUAL_VARIANT_ID     ← LemonSqueezy: Products → Plume Pro → Variants
# PROXY_SIGNATURE_SECRET is no longer used — can be deleted:
# wrangler secret delete PROXY_SIGNATURE_SECRET

# ── Dev environment ───────────────────────────────────────────────────────────
# Deployed separately as "plume-proxy-dev" — exposes /dev/* endpoints.
# Used by localhost (Docker) and staging4 installs only.
# Production Worker does NOT have DEV_ENDPOINTS_ENABLED, so /dev/* routes
# return 404 there regardless of auth.
#
# One-time setup (run from plume-proxy/):
#   1. wrangler kv namespace create "USAGE_KV" --env dev
#      → copy the returned id into [[env.dev.kv_namespaces]] below
#   2. wrangler secret put ANTHROPIC_API_KEY --env dev
#      wrangler secret put OPENAI_API_KEY --env dev
#      wrangler secret put GEMINI_API_KEY --env dev
#      wrangler secret put LS_WEBHOOK_SECRET --env dev
#      wrangler secret put LS_PRO_MONTHLY_VARIANT_ID --env dev
#      wrangler secret put LS_PRO_ANNUAL_VARIANT_ID --env dev
#   3. npm run deploy:dev
#      → Cloudflare will print the dev Worker URL (e.g. plume-proxy-dev.<account>.workers.dev)
#   4. Set that URL as the proxy endpoint in your localhost + staging WP installs
[env.dev]
name = "plume-proxy-dev"

[env.dev.vars]
DEV_ENDPOINTS_ENABLED = "1"

[[env.dev.kv_namespaces]]
binding = "USAGE_KV"
id = "46d46fc066354b3a946fd734bca7eb1a"

[[env.dev.analytics_engine_datasets]]
binding = "PLUME_METRICS"
dataset = "plume_metrics_dev"

# Bindings are not inherited by environments, so they are redeclared here.
[[env.dev.analytics_engine_datasets]]
binding = "PLUME_EVENTS"
dataset = "plume_events_dev"

[[env.dev.ratelimits]]
name = "EVENTS_IP_LIMITER"
namespace_id = "1201"

  [env.dev.ratelimits.simple]
  limit = 120
  period = 60

[[env.dev.ratelimits]]
name = "EVENTS_INSTALL_LIMITER"
namespace_id = "1202"

  [env.dev.ratelimits.simple]
  limit = 30
  period = 60
