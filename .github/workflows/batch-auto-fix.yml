name: Batch Auto-fix Code Review Issues

# Triggered by claude-code-review.yml via repository_dispatch once per PR —
# one Claude session fixes all auto-fixable issues instead of one session per
# issue, eliminating (N-1) redundant cold-start costs per PR.
on:
  repository_dispatch:
    types: [batch-auto-fix]

# One run per PR at a time: a re-dispatch must not race the previous run on
# git push or on the status comment. The running job is never cancelled, but
# GitHub keeps only ONE pending run per group, so a third dispatch cancels the
# queued second. Harmless: the report recomputes everything from live state.
concurrency:
  group: batch-auto-fix-${{ github.event.client_payload.pr_number }}
  cancel-in-progress: false

jobs:
  batch-autofix:
    name: Claude Batch Auto-fix
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # Open PRs only need the latest commit — full history is not required.
          fetch-depth: 1
          # GH_PAT (with workflow scope) is required to push commits that touch
          # .github/workflows/ files. GITHUB_TOKEN cannot push workflow file changes.
          token: ${{ secrets.GH_PAT }}

      - name: Stage trusted status script
        # The checkout above is the default branch (repository_dispatch). Copy the
        # script out before the PR branch replaces the working tree: it runs with
        # write tokens and must never be PR-controlled code.
        run: cp .github/scripts/autofix-status.mjs "$RUNNER_TEMP/autofix-status.mjs"

      - name: Validate dispatch payload
        # Every value from client_payload is untrusted. It is read via env only,
        # validated here, and later steps (and the prompt) use these outputs.
        id: payload
        env:
          PAYLOAD_JSON: ${{ toJson(github.event.client_payload) }}
        run: node "$RUNNER_TEMP/autofix-status.mjs" validate-payload

      - name: Ensure needs-manual-fix label exists
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          gh label create "needs-manual-fix" --color "#d93f0b" \
            --description "Not auto-fixed: needs a human (reason is in the issue body)" \
            --repo "$REPO" 2>/dev/null || true

      - name: Fetch and checkout PR head branch
        if: steps.payload.outputs.has_issues == 'true'
        run: |
          git fetch origin "$HEAD_BRANCH"
          git checkout "$HEAD_BRANCH"
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          HEAD_BRANCH: ${{ steps.payload.outputs.head_branch }}

      - name: Record start commit
        # After the head checkout, so START_SHA..HEAD holds only this run's commits.
        id: start
        if: steps.payload.outputs.has_issues == 'true'
        run: |
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "time=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer deps
        if: steps.payload.outputs.has_issues == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Cache npm deps
        if: steps.payload.outputs.has_issues == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('package-lock.json') }}
          restore-keys: ${{ runner.os }}-npm-

      - name: Install dependencies
        if: steps.payload.outputs.has_issues == 'true'
        run: |
          npm ci
          composer install --no-interaction --prefer-dist

      - name: Write issue bodies to files
        # Pre-fetch all issue bodies so Claude can cat them without extra gh calls.
        if: steps.payload.outputs.has_issues == 'true'
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          ISSUES_JSON: ${{ steps.payload.outputs.issues }}
          REPO: ${{ github.repository }}
        run: |
          for issue_number in $(echo "$ISSUES_JSON" | jq -r '.[]'); do
            gh issue view "$issue_number" \
              --repo "$REPO" \
              --json body --jq '.body' \
              > "/tmp/issue-${issue_number}-body.txt"
            echo "Wrote body for issue #${issue_number}"
          done

      - name: Run Claude batch auto-fix
        id: claude
        if: steps.payload.outputs.has_issues == 'true'
        uses: anthropics/claude-code-action@d44caa1f5268e7643c11e317db4c2ad1e5ea3211 # v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          prompt: |
            You are fixing a batch of code-review issues found in PR #${{ steps.payload.outputs.pr_number }}.

            **Already done — no further lookups needed:**
            - Source PR: #${{ steps.payload.outputs.pr_number }} (https://github.com/${{ github.repository }}/pull/${{ steps.payload.outputs.pr_number }})
            - PR state: OPEN
            - Head branch: `${{ steps.payload.outputs.head_branch }}` is already checked out
            - Base branch: `${{ steps.payload.outputs.base_branch }}`
            - `node_modules/` and PHP vendor dependencies are already installed
            - Each issue body has been pre-fetched to `/tmp/issue-<N>-body.txt`

            **Issues to fix (process all of them):**
            ${{ steps.payload.outputs.issues_csv }}

            ---

            ## Your task — two phases

            ### Phase 1 — Read all issue bodies and pre-load affected files

            For every issue number listed above:
            ```
            cat /tmp/issue-<N>-body.txt
            ```

            Extract the file path from each issue's `## Context` section and build a map of
            `file → [issue numbers that touch it]`.

            Read each unique file **exactly once** now, using the Read tool, and keep the
            contents in working memory. Do not re-read a file you have already read.
            Issues that touch no identifiable file are processed last as a single group.

            ### Phase 2 — Fix and commit each issue individually

            Work through all issues in file-group order (all issues for file A, then file B,
            etc.) but commit and close each fixed issue as its own atomic unit:

            **A — Apply the minimal fix for this issue**
            Use the file content already in memory from Phase 1. Make the smallest correct change.
            If this issue has the `nits` label, apply ALL listed nit items in a single edit.
            If you cannot fix it (it needs an external value such as an API key, secret,
            account ID or business decision, or it turns out to be too large): post a comment
            on the issue whose FIRST line is the reason in one sentence, and leave the issue
            OPEN. Do NOT close it. Optionally also record one line `<number><TAB><reason>` (a
            literal TAB character between the number and the text) in `/tmp/autofix-unfixed.tsv`:
            if the file exists, Read it first, then Write the whole file with all previous
            lines plus the new one; for a new file just Write it. Then move to the next issue without committing. Do NOT
            stop — always process every issue in the list.

            **B — Run linting (PHP files only)**
            ```bash
            ./vendor/bin/phpcs --standard=phpcs.xml.dist <file>
            ```
            Fix any new PHPCS violations before committing.

            **C — Commit this issue's fix**
            ```bash
            git commit -m "fix: <concise description> (closes #<N>)"
            ```

            **D — Push immediately**
            ```bash
            git push origin ${{ steps.payload.outputs.head_branch }}
            ```
            Push after every individual commit so progress is never lost if the session ends early.

            **E — Close the issue (only after its fix is pushed)**
            ```bash
            gh issue close <N> \
              --comment "✅ Fixed in $(git rev-parse --short HEAD). <Short summary.>" \
              --repo ${{ github.repository }}
            ```
            Never close an issue you did not fix.

            Then record the same short summary, in your own words, for the PR status
            comment: one line `<N><TAB><summary>` (a literal TAB character between the number
            and the text) in `/tmp/autofix-summary.tsv`. You cannot append (no `echo >>`): if
            the file exists, Read it first, then Write the whole file with all previous lines
            plus the new one; for a new file just Write it. Plain text, no backticks, one line
            per issue. The workflow shows it as written and uses it for display only.

            **F — Move to the next issue**
            Repeat A–F for every remaining issue.

            ---

            ## After ALL issues are processed

            Do not post any PR comment: the workflow reports the outcome itself, from GitHub
            and git state plus your summary file.

            ---

            ## Constraints
            - PHP: follow WordPress Coding Standards (PHPCS ruleset in `phpcs.xml.dist`).
              Prefix functions with `nj_` or use `Plume\` namespace.
            - JS/CSS: fix only what is reported — do not reformat unrelated code.
            - PHPUnit: fix the code under test, not the tests, unless the assertion is clearly wrong.
            - Do NOT bump version numbers, modify `composer.lock`, or change `package-lock.json`.
            - Do NOT open new PRs — push all fixes directly to the head branch.
            - Do NOT open more than one PR per issue.

          claude_args: "--model claude-opus-4-8 --allowedTools Bash(git:*),Bash(gh:*),Bash(composer:*),Bash(npm:*),Bash(npx:*),Bash(./vendor/bin/phpcs:*),Bash(./vendor/bin/phpunit:*),Read,Edit,MultiEdit,Write,Glob,Grep,LS"

      - name: Report outcome (deterministic)
        # No LLM. Fixed = issue closed AND a commit in START_SHA..HEAD references it
        # AND HEAD is pushed. Also lists issues the review did not queue, guards
        # against open review issues in no list, and labels unfixed ones so a
        # re-run does not re-queue them forever (not after a failed session, so a
        # re-run can retry). Per-issue summaries come from /tmp/autofix-summary.tsv,
        # else the commit subject, else the issue title; they never decide Fixed.
        # It also adds `Closes #N` to the PR body, only for issues whose fix is
        # pushed. Never fails the job.
        if: always() && steps.payload.outcome == 'success'
        continue-on-error: true
        env:
          # github.token (not GH_PAT): the report is authored by github-actions[bot],
          # which is what the edit-in-place anti-spoof check matches.
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ steps.payload.outputs.pr_number }}
          HEAD_BRANCH: ${{ steps.payload.outputs.head_branch }}
          ISSUES_JSON: ${{ steps.payload.outputs.issues }}
          MANUAL_JSON: ${{ steps.payload.outputs.manual }}
          START_SHA: ${{ steps.start.outputs.sha }}
          START_TIME: ${{ steps.start.outputs.time }}
          SESSION_OUTCOME: ${{ steps.claude.outcome }}
          UNFIXED_TSV: /tmp/autofix-unfixed.tsv
          SUMMARY_TSV: /tmp/autofix-summary.tsv
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node "$RUNNER_TEMP/autofix-status.mjs" report
